<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>FlashStore - Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-bar">
        <span>NOVO CADASTRO</span> Garanta prioridade na fila de reservas
    </div>

    <header class="store-header">
        <a href="index.html" class="brand">
            <span class="brand-badge">⚡ FlashStore</span>
        </a>
        <div class="header-actions">
            <span style="font-size: 0.85rem; color: var(--text-muted);">
                Servidor: <strong id="display-server">...</strong> (<a href="index.html">Alterar</a>)
            </span>
        </div>
    </header>

    <main>
        <div class="form-container" style="max-width: 460px; margin: 20px auto;">
            <h2 class="form-title">Criar Conta de Cliente</h2>
            <p class="form-subtitle">Cadastre-se para participar das vendas relâmpago de alta demanda.</p>

            <div class="input-group">
                <label for="cad-nome">Nome Completo</label>
                <input type="text" id="cad-nome" placeholder="Ex: João da Silva">
            </div>

            <div class="input-group">
                <label for="cad-email">E-mail</label>
                <input type="email" id="cad-email" placeholder="seuemail@dominio.com">
            </div>

            <div class="input-group">
                <label for="cad-password">Senha Alfanumérica (6-20 caracteres)</label>
                <input type="password" id="cad-password" placeholder="Ex: senha123 (sem caracteres especiais)">
            </div>

            <button onclick="cadastrarUsuario()" style="width: 100%; margin-top: 8px;">Concluir Cadastro</button>

            <p style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-muted);">
                Já possui uma conta? <a href="login.html">Faça login</a>
            </p>
        </div>
    </main>

    <footer>
        <p>Tecnologias Cliente-Servidor • UTFPR / E-Commerce Flash Sale System</p>
    </footer>

    <script src="app.js"></script>
    <script>
        document.getElementById('display-server').innerText = `${localStorage.getItem('serverIp')}:${localStorage.getItem('serverPort')}`;
    </script>
</body>
</html>
