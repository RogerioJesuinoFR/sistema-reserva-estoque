<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>E-commerce - Minha Conta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>Configuração do Servidor</h2>
        <div class="server-config">
            <label>IP: <input type="text" id="server-ip"></label>
            <label>Porta: <input type="text" id="server-port"></label>
        </div>
    </header>
    <main>
        <section id="dashboard-section">
            <h2>Bem-vindo(a), <span id="user-name">Carregando...</span></h2>
            
            <div class="form-container">
                <h3>Meus Dados</h3>
                <p><strong>E-mail:</strong> <span id="user-email">...</span></p>
                <hr style="margin: 20px 0;">
                <h4>Atualizar Perfil</h4>
                <input type="text" id="upd-nome" placeholder="Alterar Nome">
                <input type="password" id="upd-password" placeholder="Alterar Senha">
                <button onclick="atualizarUsuario()">Salvar Alterações</button>
            </div>

            <div class="actions">
                <button class="danger" onclick="deletarUsuario()">Apagar Minha Conta</button>
                <button onclick="fazerLogout()">Sair (Logout)</button>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
