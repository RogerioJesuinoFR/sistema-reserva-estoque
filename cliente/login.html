<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>E-commerce - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main style="max-width: 400px; margin: 50px auto;">
        <div class="form-container">
            <h3 style="text-align: center;">Entrar no Sistema</h3>
            <p style="text-align: center; font-size: 0.8em; color: #888;">
                Conectado a: <span id="display-server">...</span> 
                (<a href="index.html" style="color: #0066cc;">Alterar</a>)
            </p>
            <br>
            <input type="email" id="login-email" placeholder="E-mail (@ e domínio obrigatórios)">
            <input type="password" id="login-password" placeholder="Senha (6-20 chars alfanuméricos)">
            <button onclick="fazerLogin()" style="width: 100%;">Fazer Login</button>
            <p style="text-align: center; margin-top: 15px;">Não tem conta? <a href="cadastro.html">Cadastre-se aqui</a></p>
        </div>
    </main>
    <script src="app.js"></script>
    <script>
        // Exibe o servidor conectado
        document.getElementById('display-server').innerText = `${localStorage.getItem('serverIp')}:${localStorage.getItem('serverPort')}`;
    </script>
</body>
</html>
