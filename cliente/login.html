<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>E-commerce - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>Configuração do Servidor</h2>
        <div class="server-config">
            <label>IP: <input type="text" id="server-ip"></label>
            <label>Porta: <input type="text" id="server-port"></label>
        </div>
    </header>
    <main>
        <div class="form-container">
            <h3>Entrar no Sistema</h3>
            <input type="email" id="login-email" placeholder="E-mail (@ e domínio obrigatórios)">
            <input type="password" id="login-password" placeholder="Senha (6-20 chars alfanuméricos)">
            <button onclick="fazerLogin()">Fazer Login</button>
            <p>Não tem conta? <a href="cadastro.html">Cadastre-se aqui</a></p>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
