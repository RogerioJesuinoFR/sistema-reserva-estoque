<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>E-commerce - Conectar ao Servidor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="form-container" style="text-align: center; max-width: 420px; margin: 80px auto;">
            <h2>Conectar ao Servidor</h2>
            <p style="color: #666; margin-bottom: 20px;">Informe o IP e a Porta do servidor de destino.</p>
            
            <div style="text-align: left;">
                <label for="setup-ip"><strong>IP do Servidor:</strong></label>
                <input type="text" id="setup-ip" placeholder="Ex: 127.0.0.1" value="127.0.0.1">
                
                <label for="setup-port" style="margin-top: 10px; display: block;"><strong>Porta:</strong></label>
                <input type="text" id="setup-port" placeholder="Ex: 3000" value="3000">
            </div>

            <button id="btn-connect" onclick="testarEConectar()" style="width: 100%; margin-top: 20px;">Testar Conexão e Entrar</button>
            <div id="status-box" style="display: none; margin-top: 15px; padding: 12px; border-radius: 6px; font-size: 0.9em;"></div>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        window.onload = () => {
            const savedIp = localStorage.getItem('serverIp');
            const savedPort = localStorage.getItem('serverPort');
            if (savedIp) document.getElementById('setup-ip').value = savedIp;
            if (savedPort) document.getElementById('setup-port').value = savedPort;
        };

        async function testarEConectar() {
            const ip = document.getElementById('setup-ip').value.trim();
            const port = document.getElementById('setup-port').value.trim();
            const btn = document.getElementById('btn-connect');

            if (!ip || !port) {
                exibirStatus('Por favor, preencha o IP e a Porta.', 'error');
                return;
            }

            btn.disabled = true;
            exibirStatus('⏳ Testando conexão com o servidor...', 'info');

            const url = `http://${ip}:${port}/api/v1`;
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3000);

            try {
                const response = await fetch(`${url}/ping`, {
                    method: 'GET',
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (response.ok) {
                    exibirStatus(`✅ Sucesso! Servidor respondendo em /api/v1. Redirecionando...`, 'success');
                    localStorage.setItem('serverIp', ip);
                    localStorage.setItem('serverPort', port);

                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1200);
                } else {
                    exibirStatus(`❌ Servidor respondeu com erro (Status ${response.status}).`, 'error');
                    btn.disabled = false;
                }
            } catch (err) {
                clearTimeout(timeoutId);
                btn.disabled = false;
                exibirStatus(`❌ Falha de Conexão: Nenhum servidor respondendo no protocolo em ${url}.`, 'error');
            }
        }

        function exibirStatus(mensagem, tipo) {
            const statusBox = document.getElementById('status-box');
            statusBox.style.display = 'block';
            statusBox.innerText = mensagem;
            if (tipo === 'info') {
                statusBox.style.background = '#e2e3e5'; statusBox.style.color = '#383d41';
            } else if (tipo === 'success') {
                statusBox.style.background = '#d4edda'; statusBox.style.color = '#155724';
            } else if (tipo === 'error') {
                statusBox.style.background = '#f8d7da'; statusBox.style.color = '#721c24';
            }
        }
    </script>
</body>
</html>
