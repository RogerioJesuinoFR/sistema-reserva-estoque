<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>FlashStore - Configuração do Servidor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-bar">
        <span>SISTEMA DE RESERVAS</span> Venda Relâmpago e Ingressos em Tempo Real
    </div>

    <header class="store-header">
        <a href="#" class="brand">
            <span class="brand-badge">⚡ FlashStore</span>
        </a>
    </header>

    <main>
        <div class="form-container" style="max-width: 460px; margin: 40px auto; text-align: center;">
            <h2 class="form-title">Conectar ao Servidor</h2>
            <p class="form-subtitle">Informe o endereço IP e a Porta para acessar a plataforma de e-commerce.</p>

            <div class="input-group">
                <label for="setup-ip">Endereço IP do Servidor</label>
                <input type="text" id="setup-ip" placeholder="Ex: 127.0.0.1" value="127.0.0.1">
            </div>

            <div class="input-group">
                <label for="setup-port">Porta de Comunicação</label>
                <input type="text" id="setup-port" placeholder="Ex: 3000" value="3000">
            </div>

            <button id="btn-connect" onclick="testarEConectar()" style="width: 100%; margin-top: 12px;">
                ⚡ Testar Conexão e Entrar
            </button>

            <div id="status-box" style="display: none; margin-top: 20px; padding: 14px; border-radius: 10px; font-size: 0.88rem; text-align: left;"></div>
        </div>
    </main>

    <footer>
        <p>Tecnologias Cliente-Servidor • UTFPR / E-Commerce Flash Sale System</p>
    </footer>

    <script src="app.js"></script>
    <script>
        window.onload = () => {
            const savedIp = localStorage.getItem('serverIp');
            const savedPort = localStorage.getItem('serverPort');
            if (savedIp) document.getElementById('setup-ip').value = savedIp;
            if (savedPort) document.getElementById('setup-port').value = savedPort;
        };

        async function testarEConectar() {
            const ip = document.getElementById('setup-ip').value.trim();
            const port = document.getElementById('setup-port').value.trim();
            const btn = document.getElementById('btn-connect');

            if (!ip || !port) {
                exibirStatus('Por favor, preencha o IP e a Porta.', 'error');
                return;
            }

            btn.disabled = true;
            exibirStatus('⏳ Estabelecendo conexão com o servidor...', 'info');

            const url = `http://${ip}:${port}/api/v1`;
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3000);

            try {
                const response = await fetch(`${url}/ping`, { method: 'GET', signal: controller.signal });
                clearTimeout(timeoutId);

                if (response.ok) {
                    exibirStatus('✅ Conexão bem-sucedida! Redirecionando para a loja...', 'success');
                    localStorage.setItem('serverIp', ip);
                    localStorage.setItem('serverPort', port);

                    setTimeout(() => { window.location.href = 'login.html'; }, 1200);
                } else {
                    exibirStatus(`❌ O servidor respondeu com erro (Status ${response.status}).`, 'error');
                    btn.disabled = false;
                }
            } catch (err) {
                clearTimeout(timeoutId);
                btn.disabled = false;
                exibirStatus(`❌ Falha de Conexão: Nenhum servidor respondendo em ${url}. Verifique se a aplicação backend está rodando.`, 'error');
            }
        }

        function exibirStatus(mensagem, tipo) {
            const statusBox = document.getElementById('status-box');
            statusBox.style.display = 'block';
            statusBox.innerText = mensagem;
            if (tipo === 'info') { statusBox.style.background = '#f1f5f9'; statusBox.style.color = '#334155'; statusBox.style.border = '1px solid #cbd5e1'; }
            else if (tipo === 'success') { statusBox.style.background = '#ecfdf5'; statusBox.style.color = '#065f46'; statusBox.style.border = '1px solid #a7f3d0'; }
            else if (tipo === 'error') { statusBox.style.background = '#fef2f2'; statusBox.style.color = '#991b1b'; statusBox.style.border = '1px solid #fecaca'; }
        }
    </script>
</body>
</html>
